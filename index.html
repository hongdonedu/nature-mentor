<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네이처 멘토 · 자연이 선생님!</title>
<meta name="description" content="3학년 생체모방 발명 교실 — AI 네이처 멘토와 함께 동물·식물의 비밀을 찾아 발명해요.">
<meta name="theme-color" content="#14432f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=4">
</head>
<body>
<div class="shell">

  <!-- ───── 왼쪽: 수업 순서 ───── -->
  <aside class="sidebar" id="sidebar" aria-label="수업 순서">
    <div class="side-head">
      <button class="brand" data-go="home"><span class="orb"></span><span>네이처 멘토</span></button>
      <button class="icon-btn menu-btn" id="closeSide" aria-label="목록 닫기">✕</button>
    </div>
    <button class="side-new" data-go="home">🏠 오늘의 미션</button>
    <div class="side-label">수업 순서</div>
    <nav class="side-list" id="sideNav"></nav>
    <div class="side-foot">
      <div class="mentor-mini"><span class="mentor-face">🤖</span><span class="mentor-leaf">🌿</span></div>
      <div class="progress-pill"><span>진행</span><span class="bar"><i id="progBar"></i></span><b id="progText">0/8</b></div>
      <button class="side-new ghost" id="teacherBtn">🔑 선생님 메뉴</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ───── 오른쪽: 내용 ───── -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="수업 순서 열기">☰</button>
      <div class="model-btn"><span class="orb small"></span><b>자연이 선생님!</b><small id="viewName">오늘의 미션</small></div>
      <div class="spacer"></div>
      <span class="top-chip status" id="netChip" title="서버 연결 상태">● 연결 확인 중</span>
      <button class="top-chip cls-chip unset" id="clsChip">🏫 <span id="clsLabel">반·번호 고르기</span></button>
      <button class="top-chip" data-go="share">🏆 발명 박람회</button>
    </header>

    <section class="content" id="content">
      <!-- 뷰는 app.js가 그려요 -->
    </section>
  </main>
</div>

<!-- 로그인 모달 -->
<div class="modal" id="loginModal" hidden>
  <div class="modal-card">
    <h2>🌿 반과 번호를 골라요</h2>
    <p class="muted">이름은 쓰지 않아요. 반과 번호만 고르면 돼요.</p>
    <div class="row">
      <label>반 <select id="selClass"></select></label>
      <label>번호 <select id="selSeat"></select></label>
    </div>
    <button class="btn big" id="loginGo">들어가기 🚀</button>
  </div>
</div>

<!-- 선생님 모달 -->
<div class="modal" id="teacherModal" hidden>
  <div class="modal-card wide">
    <div class="modal-head"><h2>🔑 선생님 메뉴</h2><button class="icon-btn" id="teacherClose">✕</button></div>
    <div id="teacherBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="config.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
